services:
  nginx:
    image: nginx:latest
    container_name: nginx_logs
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/logs:/var/log/nginx
    restart: always

  traffic:
      image: curlimages/curl
      container_name: traffic_nginx
      depends_on:
          - nginx
      command: sh -c "while true; do curl http://nginx; sleep 1; done"

  kafka:
    image: confluentinc/cp-kafka:7.7.1  #7.8.3
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_KRAFT_MODE: 'true'

      CLUSTER_ID: '1L6g7nGhU-eAKfL--X25wo' # Generated using `kafka-storage random-uuid`
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_kraft:/var/lib/kafka/data
  
  producer:
    container_name: producer_logs
    build: .
    command: python src/producer.py
    depends_on:
      - kafka
  
  consumer:
    container_name: consumer_logs
    build: .
    command: python src/consumer.py
    depends_on:
      - kafka
      - postgres
      - minio
  # create postgres database here 
  # VS Code only configures connections; it doesn’t create databases
  # next add these info to db connection in vscode
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: logusr
      POSTGRES_PASSWORD: logpsd
      POSTGRES_DB: logdb
    ports:
      - "5433:5432" # Host (my PC) → 5433, Container (Postgres) → 5432
    volumes:
    - mypfa_postgres-data:/var/lib/postgresql/data
  minio:
    image: minio/minio:latest
    container_name: minio_logs
    command: server /data --console-address ":9001"
    environment:
        - MINIO_ROOT_USER=minadmin
        - MINIO_ROOT_PASSWORD=admin2000
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
  


volumes:
  kafka_kraft:
  minio-data:
  mypfa_postgres-data: